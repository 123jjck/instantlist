<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вещь — InstantList JS</title>
    <meta name="description" content="Подробная информация о вещи Шарарама и история её правок.">
    <script>
        window.config = {};
        config['domain'] = "https://shararam.ru";
        config['fsPath'] = 'fs';
    </script>

    <!-- Применяем тему до загрузки стилей, чтобы страница не мигала белым -->
    <script>
        (function () {
            try {
                var theme = 'system';
                var match = document.cookie.match(/(?:^|; )generalSettings=([^;]*)/);
                if (match) {
                    var settings = JSON.parse(decodeURIComponent(match[1]));
                    if (settings && settings.theme) theme = settings.theme;
                }
                var isDark = theme === 'dark' ||
                    (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            } catch (e) {}
        })();
    </script>

    <link href="./static/sashimi.css" rel="stylesheet" type="text/css" />
    <script src="./maps.js"></script>
    <!-- Страница вещи грузит полные базы: в .min-версиях нет вещей вне
         списка LayerId, описаний (tr по DescTRId) и ресурсов иконок. -->
    <script src="./items.js"></script>
    <script src="./resources.js"></script>
    <script src="./item.js"></script>
    <link href="./static/style.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="./">InstantList</a>
            <nav class="topbar-nav">
                <a class="icon-button" href="javascript:history.back()">
                    <svg class="icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd"
                            d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8" />
                    </svg>
                    Назад
                </a>
            </nav>
        </div>
    </header>

    <main class="page page-narrow">
        <h1 class="page-title" id="itemTitle">Загрузка…</h1>

        <div id="itemContent">
            <p class="muted">Загружаем данные…</p>
        </div>

        <section id="relatedBlock" class="section hidden">
            <div class="section-head">
                <h2 class="section-title">Родственные вещи</h2>
            </div>
            <p class="muted small">Как правило, это одна и та же вещь, заведённая в базе заново, чтобы выдать её ещё
                раз — другим способом или за другую цену.</p>
            <div id="relatedHolder"></div>
        </section>

        <section id="historyBlock" class="section">
            <div class="section-head">
                <h2 class="section-title">История правок</h2>
                <select id="historyFilter" class="select">
                    <option value="all">Все изменения</option>
                    <option value="files">Только файлы</option>
                    <option value="params">Только параметры</option>
                </select>
            </div>
            <div id="historyHolder" class="muted">Загружаем историю…</div>
            <p class="muted small">
                История правок стала возможна благодаря
                <a class="link"
                    href="https://shararam.fandom.com/wiki/%D0%91%D0%BB%D0%BE%D0%B3_%D1%83%D1%87%D0%B0%D1%81%D1%82%D0%BD%D0%B8%D0%BA%D0%B0:Bawoos/%D0%90%D1%80%D1%85%D0%B8%D0%B2_%D0%BE%D0%B1%D0%BD%D0%BE%D0%B2%D0%BB%D0%B5%D0%BD%D0%B8%D0%B9_Flash-%D1%85%D1%80%D0%B0%D0%BD%D0%B8%D0%BB%D0%B8%D1%89%D0%B0"
                    target="_blank" rel="noopener">трудам ув. Bawoos</a>.
            </p>
        </section>
    </main>
</body>

</html>
